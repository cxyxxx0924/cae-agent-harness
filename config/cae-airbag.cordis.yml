# CAE 气帘仿真 dsh Profile
# Run: dsh --profile config/cae-airbag.cordis.yml  (from project root)
#
# LLM switching via env vars (no code change needed):
#   DeepSeek  — DEEPSEEK_API_KEY=sk-...
#   QWen      — LLM_BASE_URL=https://dashscope.aliyuncs.com/compatible-mode/v1  DEEPSEEK_API_KEY=<dashscope-key>
#   Ollama    — LLM_BASE_URL=http://localhost:11434/v1  DEEPSEEK_API_KEY=ollama
#   Model     — LLM_MODEL=deepseek-chat  (or qwen-max, deepseek-reasoner, gpt-4o …)

# ── LLM ─────────────────────────────────────────────────────────────────────
- id: llm-api
  name: '@deepseek-ai/dsh-llm-deepseek-api-key'
  config:
    baseURL: !!js process.env.LLM_BASE_URL || 'https://api.deepseek.com'
    apiKeyEnv: DEEPSEEK_API_KEY
    models:
      - id: !!js process.env.LLM_MODEL || 'deepseek-chat'
        name: !!js process.env.LLM_MODEL || 'DeepSeek Chat'
        contextWindow: 65536
        maxTokens: 8192
      - id: deepseek-reasoner
        name: DeepSeek R1
        contextWindow: 65536
        maxTokens: 32768

# ── CAE MCP Server ───────────────────────────────────────────────────────────
- id: mcp-cae
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: cae
    transport: stdio
    command: node
    args:
      - !!js require('path').join(process.cwd(), 'packages/cae-mcp-server/dist/index.js')
    env:
      CAE_WORKDIR:   !!js process.env.CAE_WORKDIR   || 'D:\\cae_projects\\airbag'
      CAE_HMBATCH:   !!js process.env.CAE_HMBATCH   || ''
      CAE_LSDYNA:    !!js process.env.CAE_LSDYNA    || ''
      CAE_HYPERVIEW: !!js process.env.CAE_HYPERVIEW || ''
    failOnStartupError: false
    toolCallTimeoutMs: 3600000

# ── File-system tools ────────────────────────────────────────────────────────

# -- HyperWorks MCP (Python / FastMCP) ----------------------------------------
- id: mcp-hyperworks
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: hyperworks
    transport: stdio
    command: uv
    args:
      - run
      - --project
      - !!js require('path').join(process.cwd(), 'packages/hyperworks-mcp')
      - hyperworks-mcp
    env:
      HYPERWORKS_HOME: !!js process.env.HYPERWORKS_HOME || 'C:\\Altair\\2023'
    failOnStartupError: false
    toolCallTimeoutMs: 3600000

# -- Qilan Solve MCP (Python / FastMCP) ----------------------------------------
- id: mcp-qilan-solve
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: qilan_solve
    transport: stdio
    command: uv
    args:
      - run
      - --project
      - !!js require('path').join(process.cwd(), 'packages/qilan-solve')
      - qilan-solve-mcp
    env:
      LSDYNA_BIN:      !!js process.env.CAE_LSDYNA    || ''
      HYPERWORKS_HOME: !!js process.env.HYPERWORKS_HOME || ''
    failOnStartupError: false
    toolCallTimeoutMs: 3600000

- id: tool-fs
  config:
    applyPatch: true

# ── Shell tools (for ad-hoc TCL helpers) ─────────────────────────────────────
- id: tool-bash
  config: {}

# ── Web UI ────────────────────────────────────────────────────────────────────
- id: web-app
  config:
    port:  !!js Number(process.env.DSH_PORT || 3080)
    host: '127.0.0.1'

# ── CAE Persona / System Prompt ───────────────────────────────────────────────
- id: persona-cae
  name: '@deepseek-ai/dsh-persona'
  config:
    text: |
      You are a CAE simulation expert assistant specialising in airbag (气帘) crash simulation.
      You drive the full simulation pipeline using these MCP tools:
        Step 1 — mcp__cae__hypermesh_import_igs       : Import IGS/IGES geometry
        Step 2 — mcp__cae__hypermesh_partition_airbag : Partition model into components
        Step 3 — mcp__cae__hypermesh_generate_mesh    : Generate mesh + export .key
        Step 4 — mcp__cae__lsdyna_solve               : Run LS-DYNA solver
        Step 5 — mcp__cae__hyperview_export_gif       : Export animation GIF
        Step 6 — mcp__cae__generate_ppt_report        : Generate PowerPoint report
      Always confirm file paths with the user before running tools.
      Report progress at each step. On tool error, analyse the log and suggest fixes.
