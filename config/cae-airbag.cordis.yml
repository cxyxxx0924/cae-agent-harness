- id: llm-deepseek
  disabled: true

- id: llm-pi-ai
  disabled: true

- id: agent-default-model
  config:
    provider: cae
    model: !!js "process.env.CAE_MODELS_CONFIGURED === '0' ? 'unconfigured' : process.env.LLM_MODEL || 'deepseek-flash'"

- id: ui-plugin-manager
  disabled: true
- id: entry-customization
  disabled: true
- id: ui-settings-account
  disabled: true
- id: ui-settings-models
  disabled: !!js process.env.CAE_DESKTOP === '1'
- id: ui-settings-plugins
  disabled: true
- id: ui-settings-plugin-inventory
  disabled: true
- id: ui-settings-shell
  disabled: true
- id: ui-settings-agent-loop
  disabled: true
- id: ui-settings-subagent
  disabled: true
- id: ui-settings-web-search
  disabled: true
- id: ui-agent-preset
  disabled: true
- id: ui-cordis
  disabled: true
- id: preset-cordis
  disabled: true
- id: preset-ptc
  disabled: true
- id: preset-minimal
  disabled: true
- id: llm-deepseek-account
  disabled: true

- id: preset-standard
  config:
    id: standard
    order: 1
    plugins:
      - id: persona
        name: '@deepseek-ai/dsh-persona'
        config:
          prefix: |
            你是 CAE 汽车气帘仿真助手，负责协助用户完成几何导入、模型分区、网格划分、
            LS-DYNA 求解、HyperView 后处理和仿真报告生成。
            使用已连接的 CAE、HyperWorks 和 Qilan Solve MCP 工具执行任务。
            LS-DYNA 求解统一使用 mcp__cae__lsdyna_solve，它会按设置选择本地软件、本地求解服务或服务端。
            服务模式下先确认模型及引用文件能被求解服务访问，不要绕过配置直接启动本地求解器。
            用户上传 IGS 后，先确认 HyperMesh 已配置；缺少批处理程序路径时暂停导入，提示到“设置 → 仿真软件”配置 HyperMesh。
            提交求解前确认当前求解方式已配置；缺少 LS-DYNA 路径或所选求解服务地址时暂停提交，提示到“设置 → 仿真软件”完成配置，保留用户已提供的文件和参数。
            运行仿真或写入文件前先与用户确认输入和输出路径，逐步汇报进度。
            提交求解前主动提示用户：求解通常需要数小时，具体耗时取决于模型规模、网格密度和计算资源。
            提交后说明正在等待计算结果；没有实际进度数据时，不要承诺具体完成时间或编造进度。
            工具失败时检查日志并说明原因；未安装软件时引导用户在“设置 → 仿真软件”配置。
      - id: agent-instructions
        name: '@deepseek-ai/dsh-agent-instructions'
        config:
          maxBytes: 65536
      - id: time-context
        name: '@deepseek-ai/dsh-time-context'
      - id: tool-fs
        name: '@deepseek-ai/dsh-tool-fs'
      - id: tool-fs-search
        name: '@deepseek-ai/dsh-tool-fs-search'
        config:
          sampleOverCapGlobResults: false
      - id: tool-bash
        name: '@deepseek-ai/dsh-tool-bash'
        disabled: !!js process.platform === 'win32'
      - id: tool-pwsh
        name: '@deepseek-ai/dsh-tool-pwsh'
        disabled: !!js process.platform !== 'win32'
      - id: tool-ask-user
        name: '@deepseek-ai/dsh-tool-ask-user'
      - id: skill-filesystem
        name: '@deepseek-ai/dsh-skill-filesystem'
      - id: tool-skill
        name: '@deepseek-ai/dsh-tool-skill'

- insert:
    - id: cae-ui
      name: '../packages/cae-ui/index.js'
      config:
        providers:
          cae:
            displayName: CAE
            api: openai-completions
            baseURL: !!js process.env.LLM_BASE_URL || 'https://api.deepseek.com/v1'
            apiKeyEnv: DEEPSEEK_API_KEY
            models: !!js >-
              (process.env.CAE_MODELS_CONFIGURED === '0' ? [] : [...new Set([process.env.LLM_MODEL || 'deepseek-flash', ...JSON.parse(process.env.CAE_MODELS || '[]')])]).map(id => ({
                id, name: id, contextWindow: 65536, maxTokens: 8192,
                reasoningEfforts: ['deepseek-flash', 'deepseek-v4-pro'].includes(id)
                  ? { off: null, low: 'low', high: 'high', max: 'max' } : undefined,
                compat: ['deepseek-flash', 'deepseek-v4-pro'].includes(id)
                  ? { thinkingFormat: 'deepseek', supportsReasoningEffort: true } : undefined
              }))

    - id: mcp-cae
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: cae
        transport: stdio
        command: node
        args:
          - !!js process.cwd() + '/packages/cae-mcp-server/dist/index.js'
        env:
          CAE_WORKDIR: !!js process.env.CAE_WORKDIR ?? ''
          CAE_HMBATCH: !!js process.env.CAE_HMBATCH ?? ''
          CAE_LSDYNA: !!js process.env.CAE_LSDYNA ?? ''
          CAE_SOLVER_LOCATION: !!js process.env.CAE_SOLVER_LOCATION ?? 'local'
          CAE_LOCAL_SOLVER_TYPE: !!js process.env.CAE_LOCAL_SOLVER_TYPE ?? 'software'
          CAE_SOLVER_SERVICE_URL: !!js process.env.CAE_SOLVER_SERVICE_URL ?? ''
          CAE_SOLVER_SERVICE_TOKEN: !!js process.env.CAE_SOLVER_SERVICE_TOKEN ?? ''
          CAE_HYPERVIEW: !!js process.env.CAE_HYPERVIEW ?? ''
        failOnStartupError: false
        toolCallTimeoutMs: 3600000

    - id: mcp-hyperworks
      name: '@deepseek-ai/dsh-mcp-client'
      disabled: !!js "process.env.CAE_ENABLE_HYPERWORKS_MCP === '0' || (!process.env.CAE_ENABLE_HYPERWORKS_MCP && !process.env.HYPERWORKS_HOME)"
      config:
        serverName: hyperworks
        transport: stdio
        command: !!js "process.cwd() + '/packages/hyperworks-mcp/.venv/' + (process.platform === 'win32' ? 'Scripts/hyperworks-mcp.exe' : 'bin/hyperworks-mcp')"
        env:
          HYPERWORKS_HOME: !!js process.env.HYPERWORKS_HOME ?? ''
        failOnStartupError: false
        toolCallTimeoutMs: 3600000
        reconnect:
          maxAttempts: 1000

    - id: mcp-qilan-solve
      name: '@deepseek-ai/dsh-mcp-client'
      disabled: !!js "process.env.CAE_ENABLE_QILAN_MCP === '0' || (!process.env.CAE_ENABLE_QILAN_MCP && !process.env.CAE_LSDYNA)"
      config:
        serverName: qilan_solve
        transport: stdio
        command: !!js "process.cwd() + '/packages/qilan-solve/.venv/' + (process.platform === 'win32' ? 'Scripts/qilan-solve-mcp.exe' : 'bin/qilan-solve-mcp')"
        env:
          LSDYNA_BIN: !!js process.env.CAE_LSDYNA ?? ''
          HYPERWORKS_HOME: !!js process.env.HYPERWORKS_HOME ?? ''
        failOnStartupError: false
        toolCallTimeoutMs: 3600000
        reconnect:
          maxAttempts: 1000
