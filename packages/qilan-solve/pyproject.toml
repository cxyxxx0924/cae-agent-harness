[project]
name = "qilan-solve-mcp"
version = "0.1.0"
description = "MCP server for LS-DYNA curtain airbag simulation workflow"
requires-python = ">=3.10"
dependencies = [
  "fastmcp>=2.0,<3",
  "numpy>=1.24,<3",
  "matplotlib>=3.7,<4",
  "pillow>=10.0,<11",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
lspp = ["lasso-python>=2,<3"]

[project.scripts]
qilan-solve-mcp = "qilan_solve_mcp.__main__:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
